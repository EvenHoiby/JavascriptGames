<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/rockPaperScissors.css">
    <link rel="stylesheet" href="css/higherOrLower.css">
    <title>JavaScript Test</title>
</head>
<body>
    <header>
        <img id="logo" src="images/logo.png" alt="Site logo">
        <nav>
            <ul>
                <li><a class="navText" id="game1" href="#rockPaperScissors">Rock Paper Scissors</a></li>
                <li><a class="navText"  id="game2" href="#guessTheNumber">Higher or Lower</a></li>
                <li><a class="navText"  id="game3" href="">Game3</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article class="game" id="rockPaperScissors">
            <div id="gameRpsContainer">
                <div id="gameDisplay">
                    <div class="playerNameDisplay">
                        <p class="name">You</p>
                        <p class="hand" id="userHand">✊</p>
                        <div class="rpsDisplay">
                            <p class="rpsDisplayText" id="userScore">Score: 0</p>
                        </div>
                    </div>
                    <div id="countdownAndRematch">
                        <div class="rpsDisplay">
                            <p class="rpsDisplayText" id="countdown">Best of 5!</p>
                        </div>
                        <button class="hidden" id="rematchBtn">Rematch?</button>
                    </div>
                    <div class="playerNameDisplay">
                        <p class="name">Opponent</p>
                        <p class="hand" id="opponentHand">✊</p>
                        <div class="rpsDisplay">
                            <p class="rpsDisplayText" id="opponentScore">Score: 0</p>
                        </div>
                    </div>
                </div>
                <div id="choiceContainer">
                    <button class="choice" id="rock">🪨</button>
                    <button class="choice" id="paper">📄</button>
                    <button class="choice" id="scissors">✂️</button>
                </div>
            </div>
        </article>

        <article class="game" id="guessTheNumber">
            <div id="gameHolContainer">
                <p id="holTitleText">Higher or Lower</p>
                <div class="holArticle">
                    <div id="answerDisplay">
                        <p class="displayText smallFont" id="gameAnswer">-</p>
                        <p class="displayText smallFont" id="guessAmount">Guess: 0</p>
                        <p class="displayText smallFont" id="highscore">Highscore: -</p>
                    </div>
                    <div id="guessDisplay">
                        <p id="holGuessText">Guess a number from 1 to 100</p>
                        <form onsubmit="handleSubmit(event)" id="inputDisplay">
                            <input type="text" placeholder="Type a number" id="holUserInput">
                            <button type="submit" id="holAnswerBtn">Enter</button>
                        </form>
                        <button id="holNewNumberBtn">New Number</button>
                    </div>
                </div>
                <div class="holArticle" id="holResponsArticle">
                    <div id="holResponsList"></div>
                </div>
            </div>
        </article>

        <article class="game" id="calculator">
        </article>
    </main>
    

    <footer>
        <p>evenhoiby@gmail.com</p>
    </footer>
    <script src="javascript/rockPaperScissors.js"></script>
    <script src="javascript/higherOrLower.js"></script>
</body>
</html>
